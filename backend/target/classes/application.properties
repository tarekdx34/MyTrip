# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/mytrip_airline
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.security.enabled=false
# Add these properties to handle naming strategy
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
# Server Configuration
server.port=8081

# JWT Configuration - Secret must be at least 32 bytes (256 bits) long
jwt.secret=myVeryLongSecretKeyThatIsAtLeast32BytesLongForJWTSecurityAndHMACAlgorithm
jwt.expiration=86400000